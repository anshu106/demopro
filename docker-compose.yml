services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db_data:/app/data
    environment:
      - DB_PATH=/app/data/shop.db
    expose:
      - "3001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
